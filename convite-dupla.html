<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite para Dupla — Ezer.app</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F5F0E8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { color: #1A2D4F; font-size: 22px; margin: 0 0 8px; }
    p  { color: #6B7280; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
    .btn {
      display: inline-block;
      background: #C8860A;
      color: #fff;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
    }
    .store { margin-top: 20px; font-size: 13px; color: #9CA3AF; }
    .store a { color: #1A2D4F; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔥</div>
    <h1>Você foi convidado para uma dupla</h1>
    <p>Caminhem juntos em devocionais e propósitos pelo Ezer.app.</p>
    <a class="btn" id="btn-abrir">Abrir no Ezer.app</a>
    <p class="store">
      Não tem o app?
      <a href="https://play.google.com/store/apps/details?id=com.ezer.app">Baixe na Play Store</a>
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo') || '';
    const deepLink = 'ezer-app://entrar-dupla/' + encodeURIComponent(codigo);

    document.getElementById('btn-abrir').href = deepLink;

    // Tenta abrir o app automaticamente após 300ms.
    // Se o app não estiver instalado, o setTimeout expira sem efeito
    // e a pessoa vê o botão da Play Store normalmente.
    setTimeout(() => { window.location.href = deepLink; }, 300);
  </script>
</body>
</html>
